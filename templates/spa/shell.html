{% load static vite siteicon %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ SITE_NAME }} — {{ SITE_TAGLINE }}</title>
<meta name="description" content="{{ SEO_DESC }}">
<meta name="robots" content="{% if noindex %}noindex, nofollow{% else %}index, follow, max-image-preview:large, max-snippet:-1{% endif %}">
{% if GOOGLE_SITE_VERIFICATION %}<meta name="google-site-verification" content="{{ GOOGLE_SITE_VERIFICATION }}">
{% endif %}<link rel="canonical" href="{{ SEO_CANONICAL }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ SITE_NAME }}">
<meta property="og:locale" content="{{ SEO_LOCALE }}">
<meta property="og:title" content="{{ SITE_NAME }} — {{ SITE_TAGLINE }}">
<meta property="og:description" content="{{ SEO_DESC }}">
<meta property="og:url" content="{{ SEO_CANONICAL }}">
<meta property="og:image" content="{{ SEO_IMAGE }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ SITE_NAME }} — {{ SITE_TAGLINE }}">
<meta name="twitter:description" content="{{ SEO_DESC }}">
<meta name="twitter:image" content="{{ SEO_IMAGE }}">
<script>
/* يضبط المظهر قبل رسم الصفحة — نفس مفتاح الموقع القديم (leila-theme)،
   فاختيار الزائر بيمشي بين النسختين. من غير متغيّرات Django عمداً. */
(function () {
  try {
    var t = localStorage.getItem("leila-theme");
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="{% site_icon_href 'images/logo.jpeg' %}" type="image/png">
<link rel="apple-touch-icon" href="{% site_icon_href 'images/logo.jpeg' %}">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
{% vite_assets %}
</head>
<body>
<div id="root"></div>
{{ boot|json_script:"boot-data" }}
<noscript>هذا الموقع يحتاج تفعيل JavaScript.</noscript>
</body>
</html>
