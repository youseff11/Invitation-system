{% load static i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}" data-theme="light"{% block html_attrs %}{% endblock %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ SITE_TAGLINE }}{% endblock %}">
<script>
/* يضبط المظهر قبل رسم الصفحة — يمنع ومضة اللون عند التحميل.
   لا يحتوي على أي متغيّر Django عمداً، فلا يمكن لأي formatter أن يكسره. */
(function () {
  try {
    var t = localStorage.getItem("leila-theme");
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
  /* علامة إن الجافاسكربت شغّال — الـCSS بيخبّي عناصر الظهور التدريجي
     تحت html.js بس، فمن غير جافاسكربت الصفحة بتفضل ظاهرة بالكامل. */
  document.documentElement.classList.add("js");
  /* راجعين من تبديل لغة؟ الصفحة تظهر كاملة من غير أي ظهور تدريجي.
     لازم يتحط هنا قبل أول رسم، وإلا هتلمح الصفحة وهي بتتبني من أول وجديد. */
  try {
    if (sessionStorage.getItem("farha-lang-switch")) {
      document.documentElement.classList.add("no-intro");
    }
  } catch (e) {}
  /* اللغة قبل أول رسم — بس على الصفحات اللي بتطبع اللغتين مع بعض.
     الصفحات التانية بتسيب اللغة للسيرفر زي ما هي، وإلا هنقلب اتجاه
     صفحة نصّها لسه بلغة واحدة. */
  try {
    var r = document.documentElement;
    if (r.hasAttribute("data-bilingual")) {
      var l = localStorage.getItem("farha-lang");
      if (l === "ar" || l === "en") {
        r.setAttribute("lang", l);
        r.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
        var ti = r.getAttribute("data-title-" + l);
        if (ti) document.title = ti;
      }
    }
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="icon" href="{% static 'images/logo.jpeg' %}" type="image/png">
<link rel="shortcut icon" href="{% static 'images/logo.jpeg' %}" type="image/png">
<link rel="apple-touch-icon" href="{% static 'images/logo.jpeg' %}">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="{% static 'css/site.css' %}?v={{ ASSET_V }}">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block chrome %}{% endblock %}
{% block content %}{% endblock %}
<script src="{% static 'js/site.js' %}?v={{ ASSET_V }}" defer></script>
{% block extra_js %}{% endblock %}
</body>
</html>
